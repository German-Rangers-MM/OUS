name: Package Mission and Upload to FTP Server

on:
  workflow_dispatch:
    inputs:
      path:
        description: 'Path to the mission folder (relative to repository root, e.g., "co10_example.map"). Leave empty to package all missions.'
        required: false
        default: ''
      version:
        description: 'Version string (e.g., "1.0.0" or "v1.0.0"). If empty, the latest Git tag will be used.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Missions
        uses: actions/checkout@v4
        with:
          path: source
          lfs: true
          fetch-depth: 0                # needed to get tags for version detection

      # List available mission folders (for user reference)
      - name: List available mission folders
        run: |
          echo "### 📁 Available mission folders" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          find source -maxdepth 2 -type d -name "*.map" | sed 's|source/||' | sort | while read folder; do
            echo "- \`$folder\`" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** Use the exact relative path in the 'path' input above." >> $GITHUB_STEP_SUMMARY

      # Determine version (from input or latest tag)
      - name: Get and Transform Version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            TAG="${{ inputs.version }}"
          else
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          fi
          CLEAN_VERSION=$(echo "$TAG" | sed -E '
            s/^v//;
            s/([0-9]+)\.([0-9]+)\.([0-9]+)/\1\2\3/;
            s/\+.*//;
            s/-/_/;
            s/^/v/
          ')
          echo "version=$CLEAN_VERSION" >> $GITHUB_OUTPUT
          echo "Using version: $TAG → $CLEAN_VERSION"

      # Download PBO packer
      - uses: robinraju/release-downloader@v1.7
        with:
          repository: "German-Rangers-MM/PBO-Packer"
          latest: true
          fileName: "pbo-packer"

      # Package missions (single or all)
      - name: Package Missions
        run: |
          mkdir -p pbos
          chmod +x ./pbo-packer

          # Determine source folder
          if [ -n "${{ inputs.path }}" ] && [ "${{ inputs.path }}" != "/" ]; then
            # Package only the specified mission folder
            MISSION_PATH="./source/${{ inputs.path }}"
            if [ ! -d "$MISSION_PATH" ]; then
              echo "❌ Mission folder not found: $MISSION_PATH"
              exit 1
            fi
            echo "Packaging single mission: $MISSION_PATH"
            ./pbo-packer "$MISSION_PATH" ./pbos
          else
            # Package all missions
            echo "Packaging all missions from ./source"
            ./pbo-packer ./source ./pbos
          fi

          # Rename files with version
          for pbo in ./pbos/*.pbo; do
            base=$(basename "$pbo")
            mission_name="${base%%.*}"
            map_ext="${base#*.}"
            map_name="${map_ext%.*}"
            ext="${pbo##*.}"
            new_name="${mission_name}_${{ steps.version.outputs.version }}.${map_name}.${ext}"
            mv "$pbo" "./pbos/$new_name"
          done

          # Write summary
          echo "### 🚀 Packed Missions" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Mission File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|--------------|------|" >> $GITHUB_STEP_SUMMARY

          for pbo in ./pbos/*.pbo; do
            size=$(ls -lh $pbo | awk '{print $5}')
            filename=$(basename "$pbo")
            echo "| \`$filename\` | $size |" >> $GITHUB_STEP_SUMMARY
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total missions:** $(ls ./pbos/*.pbo | wc -l)" >> $GITHUB_STEP_SUMMARY

          ls -lh ./pbos/

      # Upload to FTP (only the pbos folder, now containing only the selected mission(s))
      - name: Upload to FTP Server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftps
          local-dir: ./pbos